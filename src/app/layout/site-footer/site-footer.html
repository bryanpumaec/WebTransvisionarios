<footer class="mt-24 bg-primary-deep text-primary-foreground-deep">
  <div class="h-1.5 w-full bg-accent"></div>
  <div class="mx-auto grid max-w-6xl gap-10 px-4 py-14 md:grid-cols-3">
    <div>
      <div class="inline-flex rounded-full bg-white p-2">
        <img
          src="/images/logo.png"
          [attr.alt]="'Logotipo de ' + site.name"
          width="72"
          height="72"
          class="h-16 w-16"
          loading="lazy"
        />
      </div>
      <p class="mt-4 text-sm opacity-80">{{ site.tagline }}</p>
    </div>

    <div>
      <h2 class="font-display text-lg font-bold uppercase tracking-wide">Servicios</h2>
      <ul class="mt-3 space-y-2 text-sm opacity-85">
        <li><a routerLink="/servicios" fragment="logisticos">Servicios logísticos</a></li>
        <li><a routerLink="/servicios" fragment="aduaneros">Servicios aduaneros</a></li>
        <li><a routerLink="/servicios" fragment="transitos">Tránsitos</a></li>
        <li><a routerLink="/nosotros">Nosotros</a></li>
      </ul>
    </div>

    <div>
      <h2 class="font-display text-lg font-bold uppercase tracking-wide">Contacto</h2>
      <ul class="mt-3 space-y-2 text-sm opacity-85">
        <li class="flex items-center gap-2">
          <svg lucidePhone class="h-4 w-4 text-accent"></svg>
          {{ site.phone }}
        </li>
        <li class="flex items-center gap-2">
          <svg lucideMail class="h-4 w-4 text-accent"></svg>
          {{ site.email }}
        </li>
        <li class="flex items-center gap-2">
          <svg lucideMapPin class="h-4 w-4 text-accent"></svg>
          {{ site.address }}
        </li>
      </ul>
    </div>
  </div>
  <div class="border-t border-white/10 py-5 text-center text-xs opacity-70">
    © {{ year }} {{ site.name }}. Todos los derechos reservados.
  </div>
</footer>
